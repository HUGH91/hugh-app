function updates(){return intro('Updates / From Hugh','Stay in the loop.','A place for release notes, behind-the-scenes stories, and community news.')+`<div class="photostrip"><img src="assets/hugh-22.jpeg" alt="Hugh seated during the cover shoot"><img src="assets/hugh-05.jpeg" alt="Detail of Hugh’s fist pendant and HUGH belt buckle"></div><p class="credit">Please Wait to Be Seated cover shoot · Photography: Melian Junius / @violavioletti</p>`+[['MUSIC','Inside the Hood Star world','The creative world brings together music, film, and the H Star design language.'],['COMMUNITY','More than the stage','This space can bring fans closer to Hugh’s Hot Bowls, local gatherings, and the people behind the work.'],['DIRECT TO FAN','A closer connection','New releases, direct support, and fan conversations can live under one roof.']].map(x=>`<article class="feeditem"><span class="tag">${x[0]} / SAMPLE EDITORIAL</span><h3>${x[1]}</h3><p class="muted">${x[2]}</p></article>`).join('')}
function connect(){return intro('Connect / A direct line','Say something real.','Share what a song means to you. Ask a question. Bring an idea.')+`<div class="split"><form id="messageForm" class="panel" action="https://formsubmit.co/yohugh91@gmail.com" method="POST" novalidate><input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><input type="hidden" name="_subject" value="New fan message — Hugh app"><input type="hidden" name="_template" value="table"><input type="hidden" name="_next" value="https://hugh-app.mellowplume303961.chatgpt.site/thanks.html"><label for="name">Your name</label><input id="name" name="name" class="field" maxlength="80" required autocomplete="name"><label for="email">Your email</label><input id="email" name="email" class="field" type="email" maxlength="254" required autocomplete="email"><label for="message">Your message</label><textarea id="message" name="message" class="field" maxlength="2000" required placeholder="What’s on your mind?"></textarea><button class="btn" id="sendMessage" type="submit">Send message</button><p id="messageStatus" role="status" aria-live="polite" style="font-size:14px;line-height:1.6;margin-top:18px"></p><a id="emailFallback" class="textbtn" href="mailto:yohugh91@gmail.com" style="display:inline-block;margin-top:12px">Send using your email app instead ↗</a><p class="mini">Your name, email, and message are processed by FormSubmit and forwarded to Hugh’s inbox. Your email lets Hugh reply directly. Please do not include sensitive information.</p><p class="mini">Setup preview: inbox activation is required before delivery is ready.</p></form><div><img class="connectphoto" src="assets/hugh-34.jpeg" alt="Hugh in a blue Dodgers jersey"><span class="eyebrow">Closer to the source</span><h2>A direct line to Hugh.</h2><p class="muted">Messages go to <a href="mailto:yohugh91@gmail.com">Yohugh91@gmail.com</a>. Replies come by email, so use an address you check.</p><p class="muted">Prefer your own email app? <a href="mailto:yohugh91@gmail.com?subject=Message%20from%20Hugh%20app">Email Hugh directly ↗</a></p></div></div>`}
function support(){return intro('Proud to Pay / Direct release support','Your support. Your choice.','A direct way to back Hugh’s next release. Choose a suggested amount or set your own.')+`<div class="split"><div><div class="cover blue" style="aspect-ratio:1.2"><div class="title" style="font-size:85px">HOOD<br>STAR.</div><small>Release offer concept</small></div><h3>Hood Star · Direct release edition</h3><p class="muted">Proposed offer: digital album download and digital liner notes. Final release date, files, and benefits are to be confirmed.</p></div><div class="panel"><span class="eyebrow">Choose your support</span><div class="tiergrid">${[[20,'The listener'],[50,'The supporter'],[100,'The champion']].map(x=>`<button class="tier" data-amount="${x[0]}" onclick="selectAmount(${x[0]})"><b>$${x[0]}</b><span>${x[1]}</span></button>`).join('')}</div><label for="amount">Or choose your amount (USD · $20 minimum)</label><input class="field" type="number" min="20" max="10000" step="1" id="amount" value="25" oninput="updateAmount()"><div class="row"><span>Your proposed support</span><strong id="total">$25</strong></div><p class="muted">All amounts support the same proposed digital release. These sample tiers do not promise additional perks.</p><button class="btn" style="width:100%;margin-top:15px" onclick="reviewSupport()">Review support →</button><p class="mini">Preview only. No payment is collected. A payment provider and delivery system must be connected before launch.</p></div></div>`}
function selectAmount(n){document.getElementById('amount').value=n;updateAmount()}function updateAmount(){amount=Number(document.getElementById('amount').value);document.getElementById('total').textContent=Number.isFinite(amount)?'$'+amount.toLocaleString():'—';document.querySelectorAll('.tier').forEach(el=>el.classList.toggle('selected',Number(el.dataset.amount)===amount))}
function reviewSupport(){const el=document.getElementById('amount');if(!el.reportValidity()||amount<20||!Number.isFinite(amount))return;show(`<span class="eyebrow">Support preview</span><h2>Hood Star · $${amount.toLocaleString()}</h2><p>Proposed digital release support. Checkout and download delivery are not connected yet.</p><button class="btn" onclick="save('Hood Star support — $${amount}');modal.close()">Save this support option</button><p class="mini">This is not a purchase, pledge, or reservation.</p>`)}
function save(s){if(!saved.includes(s)){saved.push(s);localStorage.setItem('hugh-saved',JSON.stringify(saved))}count();toast('Saved in this browser')}function count(){document.getElementById('savedCount').textContent=saved.length}function removeSaved(i){saved.splice(i,1);localStorage.setItem('hugh-saved',JSON.stringify(saved));count();showSaved()}function showSaved(){show('<h2>Your saved collection.</h2><p class="muted">Stored on this device. No account needed for this preview.</p>'+(saved.length?saved.map((s,i)=>`<div class="row saveitem"><span>${esc(s)}</span><button class="textbtn" onclick="removeSaved(${i})">Remove</button></div>`).join(''):'<p>No saved items yet. Explore the catalog to start.</p>'))}function show(html){document.getElementById('modalContent').innerHTML=html;if(!modal.open)modal.showModal()}let toastTimer;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hidden'),2800)}let objectUrl;
function toggleMenu(){const nav=document.querySelector('nav');const open=nav.classList.toggle('open');document.getElementById('menuToggle').setAttribute('aria-expanded',String(open))}
function openSearch(){show('<h2>Find your way.</h2><label for="siteSearch">Search music, merch, or pages</label><input id="siteSearch" class="field" type="search" placeholder="Try music or Hood Star"><div id="searchResults" class="searchresults"></div>');const input=document.getElementById('siteSearch');input.oninput=()=>{const q=input.value.trim().toLowerCase();const items=[...tabs.map(t=>[t,t.toLowerCase()]),['Proud to Pay','support'],['Hood Star','music'],['Please Wait to Be Seated','music'],['Massimo Ciabatta','music'],['H Star tee','shop'],['Star Frame 1.2','shop']].filter(x=>x[0].toLowerCase().includes(q));document.getElementById('searchResults').innerHTML=items.length?items.map(x=>`<a href="#${x[1]}" onclick="modal.close()">${esc(x[0])} ↗</a>`).join(''):'<p>No results. Try music, shop, or shows.</p>'};input.oninput();input.focus()}
function bindContactForm(){
 const form=document.getElementById('messageForm');if(!form)return;
 const status=document.getElementById('messageStatus'),button=document.getElementById('sendMessage'),fallback=document.getElementById('emailFallback');
 const fallbackUrl=()=>{const name=form.elements.namedItem('name').value.trim(),email=form.elements.namedItem('email').value.trim(),message=form.elements.namedItem('message').value;fallback.href='mailto:yohugh91@gmail.com?subject='+encodeURIComponent('Message from Hugh app — '+name)+'&body='+encodeURIComponent(message+'\n\nFrom: '+name+'\nReply email: '+email)};
 form.addEventListener('input',fallbackUrl);fallbackUrl();
 form.addEventListener('submit',async e=>{e.preventDefault();if(button.disabled)return;
 const name=form.elements.namedItem('name'),email=form.elements.namedItem('email'),message=form.elements.namedItem('message');
 if(!name.value.trim()){status.textContent='Please enter your name.';name.focus();return}
 if(!email.value.trim()||!email.validity.valid){status.textContent='Please enter a valid email address so Hugh can reply.';email.focus();return}
 if(!message.value.trim()){status.textContent='Please write a message before sending.';message.focus();return}
 if(form.elements.namedItem('_honey').value){status.textContent='Unable to submit this form. Please use the email link below.';return}
 fallbackUrl();button.disabled=true;button.textContent='Sending…';status.textContent='Sending your message. Please keep this page open.';
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{const response=await fetch('https://formsubmit.co/ajax/yohugh91@gmail.com',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name:name.value.trim(),email:email.value.trim(),message:message.value.trim(),_subject:'New fan message — Hugh app',_template:'table'}),signal:controller.signal});
 let result;try{result=await response.json()}catch{throw new Error('invalid_response')}
 if(!response.ok||!(result.success===true||result.success==='true'))throw new Error('not_accepted');
 status.textContent='The email service accepted your submission. Delivery requires the inbox to be activated; this is not confirmation of inbox delivery.';button.textContent='Submitted';
 }catch(err){status.textContent='We could not confirm that your message was sent. Your text is still here. You can try again or use “Send using your email app instead” below.';button.disabled=false;button.textContent='Try again';}
 finally{clearTimeout(timer)}
 });
}
function render(){let page=location.hash.slice(1).toLowerCase()||'home';if(!['home','music','videos','shop','shows','updates','connect','support'].includes(page))page='home';document.body.classList.toggle('landing',page==='home');document.querySelector('nav').classList.remove('open');document.getElementById('menuToggle').setAttribute('aria-expanded','false');document.querySelector('nav').innerHTML=tabs.map(t=>`<button class="${page===t.toLowerCase()?'active':''}" ${page===t.toLowerCase()?'aria-current="page"':''} onclick="location.hash='${t.toLowerCase()}'">${t}</button>`).join('');if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}app.innerHTML=({home,music,videos,shop,shows,updates,connect,support})[page]();window.scrollTo(0,0);for(const type of ['audio','video']){let input=document.getElementById(type+'File');if(input)input.onchange=()=>{if(!input.files[0])return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(input.files[0]);let media=document.getElementById(type);media.src=objectUrl;media.classList.remove('hidden')}}if(page==='support')updateAmount();if(page==='connect')bindContactForm();count()}window.addEventListener('hashchange',render);render();
</script></body></html>
